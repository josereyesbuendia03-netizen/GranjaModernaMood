name: Compilar Mod Stardew Valley

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restaurar dependencias
      run: dotnet restore $(ls *.csproj) --source "https://api.nuget.org/v3/index.json"

    - name: Compilar
      run: dotnet build $(ls *.csproj) --configuration Release

    - name: Preparar carpeta de salida
      run: |
        mkdir -p ./output
        cp bin/Release/net6.0/* ./output/ 2>/dev/null || true
        cp manifest.json ./output/ 2>/dev/null || true

    - name: Subir Zip Compilado
      uses: actions/upload-artifact@v4
      with:
        name: GranjaModernaMod-Compilado
        path: ./output/
