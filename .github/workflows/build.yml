name: Compilar Mod Stardew Valley

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restaurar dependencias
      run: dotnet restore GranjaModernaLogic.csproj --source "https://api.nuget.org/v3/index.json"

    - name: Compilar Mod
      run: dotnet build GranjaModernaLogic.csproj --configuration Release -o ./output

    - name: Incluir Manifest y Recursos
      run: |
        cp manifest.json ./output/ 2>/dev/null || true
        if [ -d "assets" ]; then cp -r assets ./output/; fi
        if [ -d "i18n" ]; then cp -r i18n ./output/; fi

    - name: Subir Zip Compilado
      uses: actions/upload-artifact@v4
      with:
        name: GranjaModernaMod-v1.0
        path: ./output/
